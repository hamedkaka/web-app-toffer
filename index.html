<!DOCTYPE html>
<html>
<head>
    <!--
      If you are serving your web app in a path other than the root, change the
      href value below to reflect the base path you are serving from.

      The path provided below has to start and end with a slash "/" in order for
      it to work correctly.

      For more details:
      * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

      This is a placeholder for base href that will be replaced by the value of
      the `--base-href` argument provided to `flutter build`.
    -->
    <base href="/">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="Toffer - Smart restaurant payments">

    <!--
      Without this, mobile Safari lays the page out in a 980px virtual viewport
      and then scales it down. Flutter paints to the real viewport, so the two
      disagree: what you see and where your finger actually lands drift apart,
      and taps near the middle of the screen hit nothing at all. `viewport-fit`
      lets the app draw into the safe areas on notched iPhones.
    -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <!-- The modern spelling of the apple- tag below; both are kept. -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#03909F">

    <!-- Speed up the CanvasKit download (served from gstatic) -->
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://www.gstatic.com">

    <!-- Start fetching the app bootstrap and loading-screen assets ASAP -->
    <link rel="preload" href="flutter_bootstrap.js" as="script">
    <link rel="preload" href="icons/Icon-192.png" as="image">
    <link rel="preload" href="home_bg.png" as="image">

    <!-- iOS meta tags & icons -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Toffer">
    <link rel="apple-touch-icon" href="icons/Icon-192.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png"/>

    <title>Toffer</title>
    <link rel="manifest" href="manifest.json">

    <style>
      /*
        The load screen is a receipt printing itself. Toffer's whole subject is
        the bill at the table, so the wait is dressed as the one artifact every
        customer already recognises — paper, monospace ink, dot leaders, a torn
        edge. No webfont is loaded here on purpose: the system monospace stack
        is exactly the right voice AND costs zero bytes competing with the
        CanvasKit download this screen exists to cover.
      */
      * { margin: 0; padding: 0; box-sizing: border-box; }

      :root {
        /* The ground is the app's own top-bar white, so the load screen and
           the first painted frame sit on exactly the same surface. */
        --ground: #FFFFFF;
        --paper: #FFFCF4;
        --ink: #063E45;
        --ink-soft: #A9BEC1;
        --accent: #03909F;
        --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
                "Liberation Mono", monospace;
      }

      body {
        min-height: 100vh;
        background: var(--ground);
      }

      /* The app's own food-shape texture, same as the home background */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: url('home_bg.png') top center / 420px auto repeat;
        pointer-events: none;
        z-index: 0;
      }

      #loading-screen {
        position: fixed;
        inset: 0;
        background: var(--ground);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        z-index: 9999;
        overflow: hidden;
        transition: opacity 0.34s ease, transform 0.34s ease;
      }

      /* Same texture over the loading screen */
      #loading-screen::before {
        content: "";
        position: absolute;
        inset: 0;
        background: url('home_bg.png') top center / 420px auto repeat;
        pointer-events: none;
      }

      /* The mask below clips box-shadow, so the lift lives on a wrapper. */
      .slip {
        position: relative;
        z-index: 1;
        filter:
          drop-shadow(0 1px 2px rgba(3, 144, 159, 0.12))
          drop-shadow(0 16px 30px rgba(3, 144, 159, 0.14));
        animation: feed 0.7s cubic-bezier(.22, 1, .36, 1) both;
      }

      /* Paper strip with a torn zigzag at both ends. */
      .receipt {
        --zig: 13px;
        width: min(74vw, 252px);
        background: var(--paper);
        padding: calc(32px + var(--zig)) 24px calc(30px + var(--zig));
        text-align: center;
        -webkit-mask:
          conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg)
            bottom / var(--zig) calc(var(--zig) / 2) repeat-x,
          conic-gradient(from 135deg at top, #0000, #000 1deg 89deg, #0000 90deg)
            top / var(--zig) calc(var(--zig) / 2) repeat-x,
          linear-gradient(#000 0 0) center / 100%
            calc(100% - var(--zig)) no-repeat;
        mask:
          conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg)
            bottom / var(--zig) calc(var(--zig) / 2) repeat-x,
          conic-gradient(from 135deg at top, #0000, #000 1deg 89deg, #0000 90deg)
            top / var(--zig) calc(var(--zig) / 2) repeat-x,
          linear-gradient(#000 0 0) center / 100%
            calc(100% - var(--zig)) no-repeat;
      }

      .mark {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        display: block;
        margin: 0 auto 18px;
      }

      .wordmark {
        font-family: var(--mono);
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.4em;
        text-indent: 0.42em; /* balances the trailing letter-space */
        color: var(--ink);
      }

      .rule {
        height: 0;
        border-top: 1px dashed rgba(6, 62, 69, 0.22);
        margin: 20px 0;
      }

      .lines { list-style: none; }

      .lines li {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
        /* Each row wipes in left to right, the way a head lays down ink. */
        animation: print 3.6s var(--d, 0s) infinite backwards;
      }

      .lines li:last-child { margin-bottom: 0; }

      .tag, .amt {
        height: 6px;
        border-radius: 3px;
        background: rgba(6, 62, 69, 0.34);
      }

      .dots {
        flex: 1;
        height: 6px;
        color: var(--ink-soft);
        background-image: radial-gradient(currentColor 1px, transparent 1.3px);
        background-size: 6px 6px;
        background-position: 0 center;
        background-repeat: repeat-x;
      }

      /* The last row is the total: heavier, in brand ink. */
      .total .tag, .total .amt {
        height: 7px;
        background: var(--accent);
      }

      .total .dots { opacity: 0; }

      @keyframes print {
        0%, 6%   { clip-path: inset(0 100% 0 0); }
        20%, 88% { clip-path: inset(0 0 0 0); }
        100%     { clip-path: inset(0 100% 0 0); }
      }

      /* The slip drops in from the printer once, on first paint. */
      @keyframes feed {
        from { opacity: 0; transform: translateY(-22px); }
        to   { opacity: 1; transform: none; }
      }

      @media (prefers-reduced-motion: reduce) {
        .slip { animation: none; }
        .lines li { animation: none; }
        #loading-screen { transition: opacity 0.34s ease; }
      }
    </style>

    <!--
      Google Maps JavaScript API — google_maps_flutter_web renders through it,
      so it has to be loaded before the app starts.

      Replace YOUR_GOOGLE_MAPS_WEB_API_KEY with the web key (the one restricted
      by HTTP referrer to the app's domains in Google Cloud Console). Until it
      is set the address map renders blank on web; every other screen is
      unaffected.
    -->
    <!--
      v=quarterly pins the stable channel. The default is `weekly`, which means
      Google swaps the library under a shipped build every week — a regression
      there lands on customers with nothing changed on our side, and mobile
      Safari is where it shows up first.
    -->
    <script defer
      src="https://maps.googleapis.com/maps/api/js?v=quarterly&key=AIzaSyDYmsxfC7E7jak-VCXAom3CKAPSDl9dqDw"></script>
</head>
<body>
  <div id="loading-screen">
    <div class="slip" role="status" aria-label="Loading Toffer">
      <div class="receipt">
        <img class="mark" src="icons/Icon-192.png" alt="" />
        <p class="wordmark">TOFFER</p>

        <div class="rule"></div>

        <ul class="lines" aria-hidden="true">
          <li style="--d: 0s">
            <i class="tag" style="width: 44%"></i>
            <i class="dots"></i>
            <i class="amt" style="width: 15%"></i>
          </li>
          <li style="--d: .28s">
            <i class="tag" style="width: 30%"></i>
            <i class="dots"></i>
            <i class="amt" style="width: 18%"></i>
          </li>
          <li style="--d: .56s">
            <i class="tag" style="width: 37%"></i>
            <i class="dots"></i>
            <i class="amt" style="width: 13%"></i>
          </li>
          <li style="--d: .84s">
            <i class="tag" style="width: 25%"></i>
            <i class="dots"></i>
            <i class="amt" style="width: 16%"></i>
          </li>
        </ul>

        <div class="rule"></div>

        <ul class="lines" aria-hidden="true">
          <li class="total" style="--d: 1.18s">
            <i class="tag" style="width: 27%"></i>
            <i class="dots"></i>
            <i class="amt" style="width: 22%"></i>
          </li>
        </ul>
      </div>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading-screen');
      if (!el) return;
      el.style.opacity = '0';
      el.style.transform = 'scale(1.04)';
      setTimeout(function () { el.remove(); }, 340);
    });
  </script>
</body>
</html>
